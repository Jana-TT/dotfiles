# Pure-style prompt: path, branch with dirty marker, ahead/behind, slow-command time, then a ❯ line
add_newline = true
command_timeout = 500
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
format = "[$path]($style)"
style = "blue"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = " [$branch]($style)"
style = "bright-black"

[git_status]
format = "[$modified$staged$renamed$deleted]($style)[$ahead_behind](cyan)"
style = "bright-black"
modified = "*"
staged = "*"
renamed = "*"
deleted = "*"
ahead = "⇡"
behind = "⇣"
diverged = "⇡⇣"

[cmd_duration]
min_time = 5000
format = " [$duration]($style)"
style = "yellow"

[character]
success_symbol = "[❯](magenta)"
error_symbol = "[❯](red)"
