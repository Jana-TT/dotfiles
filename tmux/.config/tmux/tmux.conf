# Portable equivalent of what home-manager generated (no /nix/store paths).
set -g default-terminal "tmux-256color"

set -sg escape-time 0
set -g mouse on
set -g status-bg colour237
set -g status-fg colour250
setw -g mode-keys vi

# Plugin: better-mouse-mode (was a home-manager plugin). Install via tpm if wanted:
#   set -g @plugin 'nhdaly/tmux-better-mouse-mode'
#   run '~/.tmux/plugins/tpm/tpm'
